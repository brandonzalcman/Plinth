name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
      - name: Versions
        run: swift --version && sw_vers
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Bundle
        run: Scripts/bundle.sh
      - name: Build Xcode app project
        run: xcodebuild -project Plinth.xcodeproj -scheme Plinth -configuration Release -destination 'platform=macOS' -derivedDataPath DerivedData build
