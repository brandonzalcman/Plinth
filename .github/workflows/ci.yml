name: CI

# Builds and tests every pull request that touches code. A merge to main is not built again:
# the pull request already passed. Draft pull requests and ones that change only documents
# are skipped. Packaging is checked separately, in packaging.yml, only when it could break.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "release-notes/**"
      - "Design/**"
      - "marketing/**"
      - "LICENSE"
  workflow_dispatch:

# A new push to a pull request cancels the run for the push before it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
      - name: Versions
        run: swift --version && sw_vers
      # Keeps downloaded dependencies and compiled modules between runs.
      - name: Restore the Swift build folder
        uses: actions/cache@v6
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift', 'Plinth.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            spm-${{ runner.os }}-${{ hashFiles('Package.swift', 'Plinth.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-
      - name: Build
        run: swift build --build-tests
      - name: Test
        run: swift test --skip-build
      - name: Bundle
        run: Scripts/bundle.sh
