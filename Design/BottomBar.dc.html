<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Concept I: Floating bottom bar</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#2F5BEA}a:hover{color:#1E3FB0}
</style>
</helmet>
<div style="position: relative; width: 1200px; height: 760px; box-sizing: border-box; font-family: Inter, system-ui, sans-serif; color: #1C1C1A; background: #FFFFFF; border: 1px solid #D9D9D4; border-radius: 12px; overflow: hidden">
<div aria-hidden="true" style="position: absolute; top: 18px; left: 18px; display: flex; gap: 8px">
<span style="width: 12px; height: 12px; border-radius: 50%; background: #D0D0CB"></span>
<span style="width: 12px; height: 12px; border-radius: 50%; background: #D0D0CB"></span>
<span style="width: 12px; height: 12px; border-radius: 50%; background: #D0D0CB"></span>
</div>
<div aria-hidden="true" style="height: 100%; box-sizing: border-box; padding: 64px 140px 0; display: flex; flex-direction: column; gap: 16px">
<div style="width: 420px; height: 28px; border-radius: 6px; background: #E4E4E0"></div>
<div style="height: 12px; border-radius: 6px; background: #EFEFEC"></div>
<div style="height: 12px; border-radius: 6px; background: #EFEFEC"></div>
<div style="width: 70%; height: 12px; border-radius: 6px; background: #EFEFEC"></div>
<div style="flex-grow: 1; margin-top: 16px; border-radius: 12px 12px 0 0; background: #F4F4F2"></div>
</div>
<nav aria-label="Open pages" style="position: absolute; left: 20px; right: 20px; bottom: 16px; height: 64px; box-sizing: border-box; padding: 0 10px; display: flex; align-items: center; gap: 8px; background: #FFFFFF; border: 1px solid #D9D9D4; border-radius: 20px; box-shadow: 0 10px 32px rgba(0,0,0,0.14)">
<button aria-label="Mail, pinned" style="width: 44px; height: 44px; border: none; border-radius: 12px; background: #C2532D; color: #FFFFFF; font: 600 15px Inter, sans-serif">M</button>
<button aria-label="Calendar, pinned" style="width: 44px; height: 44px; border: none; border-radius: 12px; background: #1F7A5C; color: #FFFFFF; font: 600 15px Inter, sans-serif">C</button>
<span aria-hidden="true" style="width: 1px; height: 28px; background: #E2E2DD"></span>
<div role="group" aria-label="Example Air" style="height: 48px; box-sizing: border-box; padding: 0 2px 0 10px; display: flex; align-items: center; gap: 2px; background: #F4F4F2; border-radius: 14px">
<span aria-hidden="true" style="width: 16px; height: 16px; margin-right: 4px; border-radius: 4px; background: {{accent}}"></span>
<button style="height: 44px; padding: 0 10px; border: none; border-radius: 12px; background: transparent; color: #5C5C57; font: 500 13px Inter, sans-serif">Flight search</button>
<button style="height: 44px; padding: 0 10px; border: none; border-radius: 12px; background: transparent; color: #5C5C57; font: 500 13px Inter, sans-serif">Fare calendar</button>
<button aria-current="page" style="height: 44px; padding: 0 14px; border: none; border-radius: 12px; background: {{accent}}; color: #FFFFFF; font: 600 13px Inter, sans-serif">Seat map</button>
</div>
<div role="group" aria-label="Docs" style="height: 48px; box-sizing: border-box; padding: 0 2px 0 10px; display: flex; align-items: center; gap: 2px; background: #F4F4F2; border-radius: 14px">
<span aria-hidden="true" style="width: 16px; height: 16px; margin-right: 4px; border-radius: 4px; background: #6A4BD0"></span>
<button style="height: 44px; padding: 0 10px; border: none; border-radius: 12px; background: transparent; color: #5C5C57; font: 500 13px Inter, sans-serif">Trip notes</button>
<button style="height: 44px; padding: 0 10px; border: none; border-radius: 12px; background: transparent; color: #5C5C57; font: 500 13px Inter, sans-serif">Budget</button>
</div>
<button aria-label="Morning briefing on News, fading" style="height: 44px; padding: 0 12px; border: 1px dashed #B9B9B3; border-radius: 12px; background: transparent; color: #5C5C57; font: 400 13px Inter, sans-serif; display: flex; align-items: center; gap: 8px"><span aria-hidden="true" style="width: 16px; height: 16px; border-radius: 4px; background: #B9B9B3"></span>Morning briefing</button>
<button aria-label="New page" style="width: 44px; height: 44px; border: none; border-radius: 12px; background: transparent; color: #5C5C57">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
</button>
<div style="flex-grow: 1"></div>
<button style="height: 44px; padding: 0 14px; border: 1px solid #D9D9D4; border-radius: 12px; background: #FFFFFF; color: #5C5C57; font: 400 13px Inter, sans-serif; display: flex; align-items: center; gap: 12px"><span>Search</span><span>⌘L</span></button>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2F5BEA"},"$preview":{"width":1200,"height":760}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#2F5BEA' };
}
}
</script>
</body>
</html>
