<!doctype html><title>Sign-in inside a shadow root</title><script>window.__c="";document.addEventListener("click",e=>window.__c+="click:"+(e.composedPath()[0].id||e.target.tagName)+",",true);document.addEventListener("submit",e=>window.__c+="SUBMIT,",true)</script>
<login-box></login-box>
<script>
  customElements.define('login-box', class extends HTMLElement {
    connectedCallback() {
      const r = this.attachShadow({ mode: 'open' });
      r.innerHTML = '<form action="done.html" method="get"><input id="user" name="user" type="text" autocomplete="username"><input id="pass" name="pass" type="password" autocomplete="current-password"><button id="go">Sign in</button></form>';
    }
  });
</script>
